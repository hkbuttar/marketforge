[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
version = "0.1.0"
description = "Local-first analytical data platform"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb>=1.0,<2", "pytz>=2024"]

[project.optional-dependencies]
transformation = ["dbt-core>=1.10,<1.11", "dbt-duckdb>=1.10,<1.11"]
orchestration = ["dagster>=1.10,<2", "dagster-webserver>=1.10,<2"]

[project.scripts]
marketforge-ingest = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*", "warehouse*"]
