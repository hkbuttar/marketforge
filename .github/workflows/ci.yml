name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Contract tests
        run: python -m unittest tests.unit.test_source_contracts -v
      - name: Property and invariant tests
        run: python -m unittest discover -s tests/property -v
      - name: FastAPI tests
        run: python -m unittest tests.integration.test_query_api -v
      - name: Failure and integration tests
        run: python -m unittest discover -s tests -v

  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt --no-use-colors
      - name: Build and test tiny deterministic fixture
        run: python -m unittest tests.integration.test_dbt_staging -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
