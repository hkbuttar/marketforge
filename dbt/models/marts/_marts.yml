version: 2

models:
  - name: mart_stream_anomalies
    description: "Optional StreamAlpha anomalies enriched with point-in-time daily, earnings, volume, and factor context."
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: event_timestamp
        data_tests: [not_null]
  - name: mart_intraday_anomalies
    description: "Portfolio-facing StreamAlpha anomaly mart with historical context and no same-day lookahead."
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: context_trade_date
        data_tests:
          - expression_is_true:
              arguments:
                expression: "context_trade_date is null or context_trade_date < cast(event_timestamp as date)"
  - name: mart_security_daily
    description: "Consumer-facing daily symbol analytics at source-specific grain."
    columns:
      - name: source_security_key
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: price_bar_key
        data_tests:
          - relationships:
              arguments:
                to: ref('int_rolling_volatility')
                field: price_bar_key
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date, source]
  - name: mart_market_daily
    description: "Cross-sectional market breadth and return statistics."
    columns:
      - name: trade_date
        data_tests: [not_null, unique]
  - name: mart_sector_daily
    description: "Daily equal-weight return statistics by reference security sector."
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: sector
        data_tests: [not_null]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [trade_date, sector]
  - name: mart_company_snapshot
    description: "Latest price, fundamental coverage, and earnings snapshot by source symbol."
    columns:
      - name: source_security_key
        data_tests: [not_null, unique]
      - name: latest_price
        data_tests: [not_null]
  - name: mart_pipeline_dataset_health
    description: "Freshness, counts, quality, quarantine, and run state for each dataset."
    columns:
      - name: dataset
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['healthy', 'degraded', 'empty', 'unknown']
    data_tests:
      - expression_is_true:
          arguments:
            expression: "row_count >= 0 and duplicate_count >= 0 and quarantine_count >= 0"
