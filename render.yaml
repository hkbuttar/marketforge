services:
  - type: web
    name: marketforge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-demo.txt && python -m scripts.build_demo_snapshot --live
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MARKETFORGE_DATABASE
        value: deploy/generated/marketforge-demo.duckdb
      - key: MARKETFORGE_METADATA_STORE
        value: deploy/generated/operational.sqlite
      - key: MARKETFORGE_LINEAGE
        value: deploy/generated/lineage.json
      - key: MARKETFORGE_RAW_ROOT
        value: deploy/generated/raw
      - key: MARKETFORGE_BENCHMARKS
        value: deploy/generated/benchmarks.json
      - key: MARKETFORGE_CORS_ORIGINS
        sync: false
      - key: MARKETFORGE_CORS_ORIGIN_REGEX
        value: https://.*[.]vercel[.]app
      - key: MARKETFORGE_ENABLE_LIVE_HOSTED_DATA
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_CONTACT_EMAIL
        sync: false
      - key: BUSINESSQUANT_API_KEY
        sync: false
      - key: NEWSAPI_API_KEY
        sync: false
