[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
version = "0.1.0"
description = "Local-first analytical data platform"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb>=1.0,<2", "pytz>=2024", "PyYAML>=6,<7"]

[project.optional-dependencies]
transformation = ["dbt-core>=1.10,<1.11", "dbt-duckdb>=1.10,<1.11"]
orchestration = ["dagster>=1.10,<2", "dagster-webserver>=1.10,<2"]
streaming = ["confluent-kafka>=2.5,<3"]
serving = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx2>=2,<3"]
dev = ["ruff>=0.12,<1", "hypothesis>=6,<7"]

[project.scripts]
marketforge-ingest = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*", "warehouse*"]

[tool.ruff]
target-version = "py311"
exclude = ["frontend", "dbt/target", "venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]
